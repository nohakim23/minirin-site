<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상담 신청함 · 미니린</title>
<style>
  @font-face { font-family: "Pretendard"; src: url("/assets/fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; font-display: swap; }
  :root { --ivory: #F4EFE7; --forest: #1B3D2F; --emerald: #2D6A4F; --soft: #4A5E54; --line: #D9D1C3; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ivory); color: var(--forest); font: 16px/1.6 "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  button { font: 600 16px/1 inherit; font-family: inherit; min-height: 48px; padding: 0 18px; border-radius: 4px; cursor: pointer; }
  .login { display: flex; flex-direction: column; gap: 12px; margin-top: 15vh; }
  .login input { font: 16px inherit; font-family: inherit; min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .primary { background: var(--forest); color: var(--ivory); border: 0; }
  .err { color: #A4402B; min-height: 1.6em; margin: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .count { background: var(--forest); color: var(--ivory); padding: 20px; border-radius: 6px; margin-bottom: 20px; }
  .count b { font-size: 40px; line-height: 1; display: block; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--forest); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 12px; }
  .card.is-new { border-left: 4px solid var(--emerald); }
  .meta { font-size: 14px; color: var(--soft); display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { background: var(--ivory); padding: 0 8px; border-radius: 3px; }
  .name { font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
  .contact { background: none; border: 0; padding: 0; min-height: 40px; color: var(--emerald); text-decoration: underline; font-weight: 500; }
  .msg { white-space: pre-wrap; margin: 8px 0 12px; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .status button { background: var(--ivory); border: 1px solid var(--line); color: var(--forest); padding: 0 6px; }
  .status button.on { background: var(--forest); color: var(--ivory); border-color: var(--forest); }
  .empty { text-align: center; color: var(--soft); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <form class="login" id="login">
    <h1>상담 신청함</h1>
    <input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" required>
    <button class="primary" type="submit">들어가기</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <section id="board" hidden>
    <div class="bar">
      <h1>상담 신청함</h1>
      <div>
        <button class="ghost" id="reload" type="button">새로고침</button>
        <button class="ghost" id="logout" type="button">나가기</button>
      </div>
    </div>
    <div class="count"><b id="new-count">0</b>새 상담 신청</div>
    <p class="err" id="board-err" role="alert"></p>
    <div id="list"></div>
  </section>
</div>

<script>
(() => {
  const KEY = 'minirin_admin_pw';
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const getPw = () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
  const setPw = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} };

  const api = async (method, body) => {
    const r = await fetch('/api/admin', {
      method,
      headers: { 'x-admin-password': getPw(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { const e = new Error('비밀번호가 맞지 않아요.'); e.auth = true; throw e; }
    if (!r.ok) throw new Error(data.error || '문제가 생겼어요.');
    return data;
  };

  const fmt = (iso) => {
    const d = new Date(iso);
    return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  const render = (rows) => {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    const list = $('list');
    list.replaceChildren();
    if (!rows.length) { list.append(el('p', 'empty', '아직 들어온 상담 신청이 없어요.')); return; }
    rows.forEach((r) => {
      const card = el('article', 'card' + (r.status === '새 문의' ? ' is-new' : ''));
      const meta = el('div', 'meta');
      meta.append(el('span', null, fmt(r.created_at)));
      if (r.course) meta.append(el('span', 'tag', r.course));
      card.append(meta, el('p', 'name', r.name));
      const c = el('button', 'contact', r.contact);
      c.type = 'button';
      c.title = '눌러서 복사';
      c.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(r.contact); c.textContent = '복사했어요 ✓'; setTimeout(() => (c.textContent = r.contact), 1200); }
        catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(c); s.removeAllRanges(); s.addRange(rg); }
      });
      card.append(c);
      if (r.message) card.append(el('p', 'msg', r.message));
      const st = el('div', 'status');
      STATUSES.forEach((s) => {
        const b = el('button', s === r.status ? 'on' : '', s);
        b.type = 'button';
        b.addEventListener('click', async () => {
          if (s === r.status) return;
          try { await api('PATCH', { id: r.id, status: s }); load(); }
          catch (e) { e.auth ? logout(e.message) : ($('board-err').textContent = e.message); }
        });
        st.append(b);
      });
      card.append(st);
      list.append(card);
    });
  };

  const load = async () => {
    $('board-err').textContent = '';
    try {
      const { rows } = await api('GET');
      $('login').hidden = true; $('board').hidden = false;
      render(rows);
    } catch (e) {
      if (e.auth) logout(e.message); else { $('login').hidden = true; $('board').hidden = false; $('board-err').textContent = e.message; }
    }
  };

  const logout = (message) => {
    setPw('');
    $('board').hidden = true; $('login').hidden = false;
    $('login-err').textContent = message || '';
    $('pw').value = ''; $('pw').focus();
  };

  $('login').addEventListener('submit', (e) => { e.preventDefault(); setPw($('pw').value); load(); });
  $('reload').addEventListener('click', load);
  $('logout').addEventListener('click', () => logout(''));
  if (getPw()) load(); else $('pw').focus();
})();
</script>
</body>
</html>
